{% extends 'vuelos/base.html' %}

{% block titulo %}Registro{% endblock %}

{% block contenido %}
<h1>Crear cuenta</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Registrarse</button>
</form>
<p>¿Ya tiene cuenta? <a href="{% url 'login' %}">Inicie sesión</a></p>
{% endblock %}
