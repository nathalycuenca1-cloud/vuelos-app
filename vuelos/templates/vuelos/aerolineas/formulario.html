{% extends 'vuelos/base.html' %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Guardar</button>
    <a class="boton boton-secundario" href="{% url 'aerolinea_list' %}">Cancelar</a>
</form>
{% endblock %}
