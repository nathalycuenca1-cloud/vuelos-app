{% extends 'vuelos/base.html' %}

{% block titulo %}Eliminar reserva{% endblock %}

{% block contenido %}
<h1>Eliminar reserva</h1>
<p>¿Está seguro de que desea eliminar <strong>{{ reserva.codigo }}</strong>? Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="boton boton-peligro">Sí, eliminar</button>
    <a class="boton boton-secundario" href="{{ reserva.get_absolute_url }}">Cancelar</a>
</form>
{% endblock %}
