{% extends 'vuelos/base.html' %}

{% block titulo %}Eliminar pasajero{% endblock %}

{% block contenido %}
<h1>Eliminar pasajero</h1>
<p>¿Está seguro de que desea eliminar <strong>{{ pasajero.nombre_completo }}</strong>? Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="boton boton-peligro">Sí, eliminar</button>
    <a class="boton boton-secundario" href="{{ pasajero.get_absolute_url }}">Cancelar</a>
</form>
{% endblock %}
