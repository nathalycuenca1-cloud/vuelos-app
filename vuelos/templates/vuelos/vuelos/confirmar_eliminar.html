{% extends 'vuelos/base.html' %}

{% block titulo %}Eliminar vuelo{% endblock %}

{% block contenido %}
<h1>Eliminar vuelo</h1>
<p>¿Está seguro de que desea eliminar <strong>{{ vuelo.codigo }}</strong>? Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="boton boton-peligro">Sí, eliminar</button>
    <a class="boton boton-secundario" href="{{ vuelo.get_absolute_url }}">Cancelar</a>
</form>
{% endblock %}
